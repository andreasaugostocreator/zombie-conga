<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Zombie Conga</title>
<meta name="description" content="Lead a conga line of survivors through the zombie apocalypse.">
<meta name="theme-color" content="#1c1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zombie Conga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1c1424; overflow: hidden; overscroll-behavior: none; }
  /* iOS 26 home-screen apps: 100% / dvh come up short by the top safe area, which left a dead strip at the bottom. */
  html { min-height: calc(100% + env(safe-area-inset-top)); }
  @media (display-mode: standalone), (display-mode: fullscreen) { html, body { height: 100vh; height: 100lvh; } }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  canvas { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// If something breaks, show it on screen (so a phone screenshot tells us what happened) instead of a frozen picture.
(function () {
  function show(msg) {
    if (document.getElementById('crash')) return;
    var d = document.createElement('div'); d.id = 'crash';
    d.style.cssText = 'position:fixed;left:12px;right:12px;top:30%;z-index:9;background:#2a1f3a;color:#fff;font:14px/1.4 -apple-system,sans-serif;padding:14px;border:3px solid #e2384a;border-radius:8px;white-space:pre-wrap;word-break:break-word';
    d.textContent = 'Oops, the game hit a bug. Please screenshot this:\n\n' + msg + '\n\nTap here to reload (your progress is saved).';
    d.onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  addEventListener('error', function (e) {
    // "Script error." with no file is a muted error from a script that isn't ours (Safari extensions, injected
    // in-app browser code): the game loads nothing cross-origin, so it carries no info and the game keeps running.
    if (!e.filename && !e.lineno && (!e.message || /^Script error\.?$/.test(e.message))) { console.warn('ignored foreign script error', e); return; }
    show((e.message || 'error') + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 4).join('\n') : '') + '\n' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  addEventListener('unhandledrejection', function (e) { show('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
})();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
